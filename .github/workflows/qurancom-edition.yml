name: Compare Quran.com Hafs edition
on:
  push:
    branches: ['release/reading-edition-1.1.0']
    paths: ['scripts/fetch-qurancom-edition.py', '.github/workflows/qurancom-edition.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/fetch-qurancom-edition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qurancom-source-comparison
          path: edition-audit/
          if-no-files-found: warn

