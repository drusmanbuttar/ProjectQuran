name: Quran corpus integrity

on:
  push:
    branches:
      - main
    paths:
      - 'dist/arabic.json'
      - 'scripts/verify-quran-integrity.mjs'
      - 'scripts/quran-uthmani-reference.json'
      - 'package.json'
      - '.github/workflows/quran-integrity.yml'
  pull_request:
    paths:
      - 'dist/arabic.json'
      - 'scripts/verify-quran-integrity.mjs'
      - 'scripts/quran-uthmani-reference.json'
      - 'package.json'
      - '.github/workflows/quran-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quran-integrity:
    name: Quran corpus integrity (6,236 ayat)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify all 6,236 Arabic ayat
        run: node scripts/verify-quran-integrity.mjs
