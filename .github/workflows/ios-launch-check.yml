name: Check iOS release startup and support header
on:
  push:
    branches: ['release/diagnose-ios-1.1.2-launch']
    paths: ['.github/workflows/ios-launch-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run ios:sync
      - name: Build simulator app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/reader-sim" CODE_SIGNING_ALLOWED=NO build
      - name: Capture the running native app on iPhone and iPad
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p store-media
          xcrun simctl list devices available -j > "$RUNNER_TEMP/reader-devices.json"
          python3 - "$RUNNER_TEMP/reader-devices.json" > "$RUNNER_TEMP/reader-devices.txt" <<'PY'
          import sys,json
          devices=[d for group,ds in json.load(open(sys.argv[1]))['devices'].items() if '.iOS-' in group for d in ds]
          for label,names in [('iPhone',['iPhone 17 Pro Max','iPhone 16 Pro Max','iPhone 15 Pro Max']),('iPhone-medium',['iPhone 17 Pro','iPhone 16 Pro','iPhone 15 Pro']),('iPad',['iPad Pro 13-inch','iPad Pro (12.9-inch','iPad Air 13-inch'])]:
              target=next((d for name in names for d in devices if (name.lower() in d['name'].lower() if label=='iPad' else name==d['name'])),None)
              assert target, (label,[d['name'] for d in devices])
              print(label,target['udid'])
          PY
          swiftc scripts/check-simulator-screen.swift -o "$RUNNER_TEMP/check-screen"
          while read -r label udid; do
            xcrun simctl boot "$udid" || xcrun simctl bootstatus "$udid" -b
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time '9:41' --batteryState charged --batteryLevel 100
            xcrun simctl install "$udid" "$RUNNER_TEMP/reader-sim/Build/Products/Release-iphonesimulator/App.app"
            xcrun simctl launch "$udid" com.drusmanbuttar.projectquran
            output="store-media/Pockett-Quran-$label.png"
            for attempt in {1..30}; do
              sleep 4
              xcrun simctl io "$udid" screenshot "$output"
              if "$RUNNER_TEMP/check-screen" "$output"; then break; fi
            done
            "$RUNNER_TEMP/check-screen" "$output"
            xcrun simctl terminate "$udid" com.drusmanbuttar.projectquran
            xcrun simctl launch "$udid" com.drusmanbuttar.projectquran
            sleep 8
            xcrun simctl io "$udid" screenshot "$output"
            "$RUNNER_TEMP/check-screen" "$output"
            xcrun simctl shutdown "$udid"
          done < "$RUNNER_TEMP/reader-devices.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pockett-quran-native-launch
          path: store-media/*.png
          if-no-files-found: error
