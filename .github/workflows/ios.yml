name: Pocket Quran iPhone build and backup tests
on:
  push:
    branches: [ios-pocket-quran]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Check text and behavior
        run: |
          pnpm run check
          node scripts/check-catalog.mjs
          node scripts/check-behavior.mjs
      - name: Prepare iOS assets and test target
        run: |
          pnpm exec cap sync ios
          sips -z 1024 1024 dist/icon-512.png --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          gem install --user-install xcodeproj -v 1.27.0 --no-document
          ruby scripts/ios-test-project.rb
          xcodebuild -version
      - name: Choose and start an iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          SIMULATOR_UDID=$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/devices.json")); print(next(v["udid"] for group in d["devices"].values() for v in group if v["name"].startswith("iPhone")))')
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Test local Quran and native backup recovery
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "id=$SIMULATOR_UDID" -derivedDataPath ios/DerivedData -resultBundlePath ios/TestResults.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Build unsigned device archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath ios/PocketQuran-UNSIGNED.xcarchive CODE_SIGNING_ALLOWED=NO archive
          ditto -c -k --keepParent ios/PocketQuran-UNSIGNED.xcarchive ios/PocketQuran-UNSIGNED-Archive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-Quran-iOS-UNSIGNED-Archive
          path: ios/PocketQuran-UNSIGNED-Archive.zip
          retention-days: 30
      - name: Preserve test report
        if: always()
        run: |
          if [ -d ios/TestResults.xcresult ]; then ditto -c -k --keepParent ios/TestResults.xcresult ios/TestResults.zip; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pocket-Quran-iOS-Test-Reports
          path: ios/TestResults.zip
          retention-days: 30
