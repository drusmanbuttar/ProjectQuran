name: Verify build 28 support on pre-dialog WebKit
on:
  push:
    branches: [release/diagnose-ios-1.1.2-launch]
    paths: [.github/workflows/check-legacy-webkit.yml]
permissions:
  contents: read
jobs:
  legacy:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.15.1-focal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 636f74331d1440e745ed7f8e64732adeb88ac41b
      - name: Open support on WebKit before native dialog support
        run: |
          npm install --prefix /tmp/legacy playwright@1.15.1 --ignore-scripts
          python3 -m http.server 8090 --directory dist >/tmp/reader-http.log 2>&1 &
          cd /tmp/legacy
          node <<'JS'
          const {webkit}=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await webkit.launch();
            try {
              const page=await browser.newPage();
              for(const path of ['index.html','privacy.html','support.html']) {
                await page.goto('http://127.0.0.1:8090/'+path);
                const native=await page.evaluate(()=>typeof document.createElement('dialog').showModal);
                assert.strictEqual(native,'undefined');
                await page.click('header #open-tip');
                await page.waitForSelector('#tip-dialog [data-tip-status]:visible');
                assert((await page.textContent('#tip-dialog [data-tip-status]')).includes('Apple in-app purchases'));
                await page.click('#tip-dialog form button');
                await page.waitForSelector('#tip-dialog',{state:'hidden'});
                console.log('PASS old WebKit inline support',path);
              }
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
